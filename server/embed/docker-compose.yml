services:
  # The API in Docker. bge-m3 itself runs in Ollama on the host (Metal GPU, ./ollama-setup.sh) — this
  # container only calls it, so it no longer downloads or loads the model. The reranker still runs here (CPU).
  # On an Apple Silicon Mac the API can also run natively (./mac-native.sh, reranker on Metal):
  # remove "cpu" from COMPOSE_PROFILES in .env and set TUNNEL_UPSTREAM=host.docker.internal:8081
  embed:
    profiles: ["cpu"]
    build: .
    image: docask-embed:local
    container_name: docask-embed
    restart: unless-stopped
    env_file: .env
    environment:
      # inside Docker the database is "db" (mac-native mode uses DATABASE_URL from .env instead)
      DATABASE_URL: postgresql://docask:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/docask
      # Ollama on the host, which listens on localhost only — Docker Desktop still forwards this name to it
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }
    # only this Mac can reach the port directly; other machines come in through the tunnel below
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # the reranker (bge-reranker-v2-m3 ≈ 2.3 GB) and bge-m3's tokenizer
      - hf-cache:/models
      - files:/data/files
    mem_limit: 4g
    # healthy = the API answers and Ollama has bge-m3 ("status": "ok"; "degraded" when Ollama is down)
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5))['status'] != 'ok')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Cloudflare Quick Tunnel: public https://<random>.trycloudflare.com → TUNNEL_UPSTREAM.
  # No account or domain needed; the URL changes every time this container restarts (see README).
  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    container_name: docask-tunnel
    restart: unless-stopped
    depends_on:
      embed: { condition: service_started, required: false }
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://${TUNNEL_UPSTREAM:-embed:8080}"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # the team's shared index (pgvector) and chat history — reachable only from this Mac
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: docask-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docask
      POSTGRES_DB: docask
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # localhost only: for mac-native mode and for backups / psql on this Mac — never the tunnel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docask -d docask"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # pg_dump every day into ./backups, keeping the last 14
  backup:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: docask-backup
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backups:/backups
      # the original files (Docker mode); mac-native mode keeps them in ~/.docask-embed/files
      - files:/files:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/docask-$$(date +%Y%m%d-%H%M).dump
          pg_dump -h db -U docask -d docask -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f"
          ls -1t /backups/docask-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
          # files are named by content: copying new ones is enough
          mkdir -p /backups/files && cp -Rn /files/. /backups/files/ 2>/dev/null && echo "files backed up"
          sleep 86400
        done
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  hf-cache:
  pgdata:
  files:
