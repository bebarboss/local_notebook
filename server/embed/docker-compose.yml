services:
  # CPU server in Docker. On an Apple Silicon Mac use fast mode instead (./mac-native.sh, Metal GPU):
  # remove "cpu" from COMPOSE_PROFILES in .env and set TUNNEL_UPSTREAM=host.docker.internal:8081
  embed:
    profiles: ["cpu"]
    build: .
    image: docask-embed:local
    container_name: docask-embed
    restart: unless-stopped
    env_file: .env
    # only this Mac can reach the port directly; other machines come in through the tunnel below
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hf-cache:/models
    mem_limit: 5g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Cloudflare Quick Tunnel: public https://<random>.trycloudflare.com → TUNNEL_UPSTREAM.
  # No account or domain needed; the URL changes every time this container restarts (see README).
  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    container_name: docask-tunnel
    restart: unless-stopped
    depends_on:
      embed: { condition: service_started, required: false }
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://${TUNNEL_UPSTREAM:-embed:8080}"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  hf-cache:
